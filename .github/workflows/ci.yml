# SPDX-License-Identifier: AGPL-3.0-only
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  # One compiler for every job, the one the code was last checked with by
  # hand. Raise it deliberately: newer lints then arrive with the change that
  # fixes them, not on an unrelated day.
  RUSTUP_TOOLCHAIN: "1.97.0"
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # compiler errors and failed tests become annotations of the run
      - run: echo "::add-matcher::.github/rust-problem-matcher.json"
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy,rustfmt --target thumbv7em-none-eabi
      - run: cargo fmt --all --check
      - run: cargo clippy -p capita-core --all-targets --all-features -- -D warnings
      - run: cargo clippy -p capita-core --all-targets -- -D warnings
      - run: cargo test -p capita-core --all-features
      - run: cargo test -p capita-core
      # no_std: build for a target without an operating system
      - run: cargo build -p capita-core --target thumbv7em-none-eabi
      - run: cargo build -p capita-core --features serde,scale --target thumbv7em-none-eabi
  pallet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # compiler errors and failed tests become annotations of the run
      - run: echo "::add-matcher::.github/rust-problem-matcher.json"
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --target wasm32v1-none
      - run: cargo clippy -p pallet-capita --all-targets -- -D warnings
      - run: cargo test -p pallet-capita
      - run: cargo check -p pallet-capita --features try-runtime
      # the form the pallet takes inside a runtime: WebAssembly, no std
      - run: cargo check -p pallet-capita --no-default-features --target wasm32v1-none
  # The test chain, natively: genesis, signed transactions, invariants.
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # compiler errors and failed tests become annotations of the run
      - run: echo "::add-matcher::.github/rust-problem-matcher.json"
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy
      - run: SKIP_WASM_BUILD=1 cargo test -p capita-runtime --features try-runtime
      - run: SKIP_WASM_BUILD=1 cargo clippy -p capita-runtime --all-targets --features try-runtime -- -D warnings
  # The runtime as WebAssembly, the node around it, and a chain that runs.
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      # compiler errors and failed tests become annotations of the run
      - run: echo "::add-matcher::.github/rust-problem-matcher.json"
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy,rust-src --target wasm32v1-none
      - name: the runtime as WebAssembly
        shell: bash
        run: cargo build --release -p capita-runtime 2>&1 | tee build.log
      - name: the node
        shell: bash
        run: cargo build --release -p capita-node 2>&1 | tee build.log
      # errors without a place in a file (build scripts, linker) too
      - name: first errors of the build, as annotations
        if: failure()
        shell: bash
        run: |
          grep -aE "^\s*(error|thread .* panicked)" -A 2 --group-separator=@@@@ build.log | tr '\n' ' ' | sed 's/@@@@/\n/g' | head -n 10 | cut -c 1-400 | while IFS= read -r line; do echo "::error::$line"; done
      - name: the chain produces blocks
        run: |
          ./target/release/capita-node --dev --tmp > node.log 2>&1 &
          for i in $(seq 1 30); do
            sleep 6
            number=$(curl -s -H 'Content-Type: application/json' -d '{"id":1,"jsonrpc":"2.0","method":"chain_getHeader","params":[]}' http://127.0.0.1:9944 | grep -o '"number":"0x[0-9a-f]*"' || true)
            echo "$number"
            case "$number" in ''|'"number":"0x0"') ;; *) exit 0 ;; esac
          done
          tail -n 50 node.log
          tail -n 6 node.log | cut -c 1-300 | while IFS= read -r line; do echo "::error::$line"; done
          exit 1
