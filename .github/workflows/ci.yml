# SPDX-License-Identifier: AGPL-3.0-only
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  # One compiler for every job, the one the code was last checked with by
  # hand. Raise it deliberately: newer lints then arrive with the change that
  # fixes them, not on an unrelated day.
  RUSTUP_TOOLCHAIN: "1.97.0"
jobs:
  # The app prototype: syntax of every module, tests of the rules it shows.
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: for f in app/*.js app/vendor/*.mjs; do node --check "$f"; done
      - run: npm test
        working-directory: app
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # compiler errors and failed tests become annotations of the run
      - run: echo "::add-matcher::.github/rust-problem-matcher.json"
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy,rustfmt --target thumbv7em-none-eabi
      - run: cargo fmt --all --check
      - run: cargo clippy -p capita-core -p capita-credential -p capita-door --all-targets --all-features -- -D warnings
      - run: cargo clippy -p capita-core -p capita-credential -p capita-door --all-targets -- -D warnings
      - run: cargo test -p capita-core -p capita-credential -p capita-door --all-features
      - run: cargo test -p capita-core -p capita-credential -p capita-door
      # the rules files: read, checked, compiled, run through the core
      - run: cargo clippy -p capita-rulefile -p capita-rules --all-targets --all-features -- -D warnings
      - run: cargo test -p capita-rulefile -p capita-rules --all-features
      # the person key: canonical forms, keyed function
      - run: cargo clippy -p capita-person-key --all-targets -- -D warnings
      - run: cargo test -p capita-person-key
      # no_std: build for a target without an operating system
      - run: cargo build -p capita-core -p capita-credential -p capita-door -p capita-rules -p capita-person-key --target thumbv7em-none-eabi
      - run: cargo build -p capita-core --features serde,scale --target thumbv7em-none-eabi
      - run: cargo build -p capita-credential --features serde,scale --target thumbv7em-none-eabi
      - run: cargo build -p capita-door --features serde,scale --target thumbv7em-none-eabi
  # The identity service: issuing logic, store, interface, Challenger client.
  issuer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: echo "::add-matcher::.github/rust-problem-matcher.json"
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy
      - run: cargo clippy -p capita-issuer --all-targets -- -D warnings
      - run: cargo test -p capita-issuer
  # The euro door: orders, vouchers, tickets, GNU Taler client, node client.
  door:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: echo "::add-matcher::.github/rust-problem-matcher.json"
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy
      - run: cargo clippy -p capita-door-service --all-targets -- -D warnings
      - run: cargo test -p capita-door-service
  pallet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # compiler errors and failed tests become annotations of the run
      - run: echo "::add-matcher::.github/rust-problem-matcher.json"
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --target wasm32v1-none
      - run: cargo clippy -p pallet-capita -p pallet-capita-credential -p pallet-capita-door --all-targets -- -D warnings
      - run: cargo test -p pallet-capita -p pallet-capita-credential -p pallet-capita-door
      - run: cargo check -p pallet-capita --features try-runtime
      - run: cargo check -p pallet-capita-credential --features try-runtime
      - run: cargo check -p pallet-capita-door --features try-runtime
      # the form the pallets take inside a runtime: WebAssembly, no std
      - run: cargo check -p pallet-capita --no-default-features --target wasm32v1-none
      - run: cargo check -p pallet-capita-credential --no-default-features --target wasm32v1-none
      - run: cargo check -p pallet-capita-door --no-default-features --target wasm32v1-none
  # The test chain, natively: genesis, signed transactions, invariants.
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # compiler errors and failed tests become annotations of the run
      - run: echo "::add-matcher::.github/rust-problem-matcher.json"
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy
      - run: SKIP_WASM_BUILD=1 cargo test -p capita-runtime --features try-runtime
      - run: SKIP_WASM_BUILD=1 cargo clippy -p capita-runtime --all-targets --features try-runtime -- -D warnings
  # The runtime as WebAssembly, the node around it, and a chain that runs.
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      # compiler errors and failed tests become annotations of the run
      - run: echo "::add-matcher::.github/rust-problem-matcher.json"
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy,rust-src --target wasm32v1-none
      - name: the runtime as WebAssembly
        shell: bash
        run: cargo build --release -p capita-runtime 2>&1 | tee build.log
      - name: the node
        shell: bash
        run: cargo build --release -p capita-node 2>&1 | tee build.log
      # errors without a place in a file (build scripts, linker) too
      - name: first errors of the build, as annotations
        if: failure()
        shell: bash
        run: |
          grep -aE "^\s*(error|thread .* panicked)|rust-lld: error" -A 2 --group-separator=@@@@ build.log | tr '\n' ' ' | sed 's/@@@@/\n/g' | head -n 10 | cut -c 1-400 | while IFS= read -r line; do echo "::error::$line"; done
      - name: the chain produces blocks
        run: |
          ./target/release/capita-node --dev --tmp > node.log 2>&1 &
          for i in $(seq 1 30); do
            sleep 6
            number=$(curl -s -H 'Content-Type: application/json' -d '{"id":1,"jsonrpc":"2.0","method":"chain_getHeader","params":[]}' http://127.0.0.1:9944 | grep -o '"number":"0x[0-9a-f]*"' || true)
            echo "$number"
            case "$number" in ''|'"number":"0x0"') ;; *) exit 0 ;; esac
          done
          tail -n 50 node.log
          tail -n 6 node.log | cut -c 1-300 | while IFS= read -r line; do echo "::error::$line"; done
          exit 1
      # A real node checks what the door writes by hand: the voucher of the
      # door of the test chains passes the signature check and waits for an
      # account to be opened; one signed with another key is refused.
      - name: the euro door reaches the chain
        shell: bash
        run: |
          cargo build --release -p capita-door-service
          ./target/release/capita-node --dev --tmp --rpc-port 9966 --port 30366 > node-door.log 2>&1 &
          python3 services/door/demo/mock_merchant.py 8791 &
          rpc() { curl -s -H 'Content-Type: application/json' -d "{\"id\":1,\"jsonrpc\":\"2.0\",\"method\":\"$1\",\"params\":$2}" http://127.0.0.1:9966; }
          genesis=""
          for i in $(seq 1 30); do
            sleep 4
            genesis=$(rpc chain_getBlockHash '[0]' | python3 -c 'import json,sys; print(json.load(sys.stdin).get("result") or "")' || true)
            [ -n "$genesis" ] && break
          done
          [ -n "$genesis" ] || { tail -n 30 node-door.log; exit 1; }
          door() {   # $1 = port, $2 = seed text
            mkdir -p "door-$1"
            printf '%s' "$2" | od -An -tx1 | tr -d ' \n' > "door-$1/seed.hex"
            echo "Bearer mock" > "door-$1/auth.txt"
            printf 'listen = "127.0.0.1:%s"\nrules = "%s/rules/dev-fast.toml"\nstore = "orders.jsonl"\n[host]\naudience = "%s"\ndoor = 0\n[keys]\nsigning_seed_file = "seed.hex"\n[merchant]\nbase_url = "http://127.0.0.1:8791/instances/capita/"\nauthorization_file = "auth.txt"\ncurrency = "KUDOS"\n[chain]\nrpc_url = "http://127.0.0.1:9966"\n' "$1" "$PWD" "$genesis" > "door-$1/door.toml"
            ./target/release/capita-door "door-$1/door.toml" > "door-$1/log" 2>&1 &
          }
          ask() {    # $1 = port; answers the "chain" field once the order is paid
            sleep 1
            order=$(curl -s -X POST -d '{"account":"0xd43593c715fdd31c61141abd04a99fd6822c8558854ccde39a5684e7a56da27d","euro":"2.50"}' "http://127.0.0.1:$1/v1/buy" | python3 -c 'import json,sys; print(json.load(sys.stdin)["order"])')
            curl -s "http://127.0.0.1:$1/v1/orders/$order" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("chain"))'
          }
          door 8792 "capita-money development door!!!"
          door 8793 "a key that is not on the list!!!"
          good=$(ask 8792); bad=$(ask 8793)
          echo "door of the chain: $good; other key: $bad"
          if [ "$good" != "waiting" ] || [ "$bad" != "failed" ]; then
            tail -n 20 door-8792/log door-8793/log node-door.log
            echo "::error::the node did not judge the vouchers as expected (good=$good, bad=$bad)"
            exit 1
          fi
