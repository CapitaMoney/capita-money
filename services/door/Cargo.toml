# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "capita-door-service"
description = "Euro door of Capita Money: takes a payment through GNU Taler and signs a voucher for bought Capita, or tickets for verifications."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "capita-door"
path = "src/main.rs"

[dependencies]
blake2 = "0.10.6"
capita-core = { workspace = true, features = ["std"] }
capita-door = { workspace = true, features = ["std"] }
capita-rulefile = { workspace = true }
ed25519-dalek = "2.2.0"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
toml = { version = "1.2", default-features = false, features = ["parse", "serde"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
