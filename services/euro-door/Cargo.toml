# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "capita-euro-door"
description = "Euro door of Capita Money: sells verification tickets for euros through a GNU Taler merchant backend. Capita itself lives on the chain."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
capita-rulefile = { workspace = true }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
toml = { version = "1.2", default-features = false, features = ["parse", "serde"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
