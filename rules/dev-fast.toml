# Capita Money – rule set "dev-fast"
# SPDX-License-Identifier: AGPL-3.0-only
#
# Not the rules. Numbers for developers: the same structure as `alpha.toml`,
# with rates so fast that an effect shows within minutes on a chain started
# with `--dev`. The tests of the runtime start from these numbers; keep them.
#
# How values are written: see `alpha.toml`.

[set]
name = "dev-fast"
title = "Fast numbers for developers"
diary = "none – examples"
params_version = 1

[issuance.start_grant]
value = "1.00"
status = "example"
source = "test chain"
note = "One Capita for every new account, to pay its own verification."

[issuance.claim_window]
value = "14 days"
status = "example"
source = "test chain"
note = "How far back a claim reaches."

[issuance.ripening]
value = "off"
status = "example"
source = "test chain"
note = "Issued Capita is usable at once."

# Money by age as in the alpha rules, so that a verification on a test
# chain shows what a person will see; the ladder below adds money by the
# minute, which the alpha rules do not have.
[issuance.age.per_year]
value = "2.00"
status = "example"
source = "test chain"
note = "Capita per completed year of age on each birthday."

[issuance.age.at_verification]
value = "1.00"
status = "example"
source = "test chain"
note = "Capita per completed year of age, once, at the first verification."

[issuance.age.min_level]
value = 1
status = "example"
source = "test chain"
note = "Verification level needed for money by age."

[[issuance.ladder]]
step = 0
name = "not verified"
min_level = 0
amount = "0.01"
per = "1 hour"
status = "example"
source = "test chain"
note = "1 cent per hour."

[[issuance.ladder]]
step = 1
name = "level 1"
min_level = 1
amount = "0.01"
per = "1 minute"
status = "example"
source = "test chain"
note = "1 cent per minute."

[[issuance.ladder]]
step = 2
name = "level 2"
min_level = 2
amount = "0.03"
per = "1 minute"
status = "example"
source = "test chain"
note = "3 cents per minute."

[caps.period]
value = "1 month"
status = "example"
source = "test chain"
note = "The time span the caps refer to."

[caps.global_cap]
value = "1_000_000.00"
status = "example"
source = "test chain"
note = "Far above the rates: no cap in effect."

[caps.ramp]
value = "off"
status = "example"
source = "test chain"
note = "No seniority ramp."

[lending.max_credit_line]
value = "500.00"
status = "example"
source = "test chain"
note = "Highest credit line an account may be granted."

[lending.max_outstanding]
value = "1000.00"
status = "example"
source = "test chain"
note = "Highest recorded debt an account may owe."

[lending.repayment_share]
value = "50 %"
status = "example"
source = "test chain"
note = "Part of each claim that goes to the lender while debt is outstanding."

[demurrage.rate]
value = "off"
status = "example"
source = "test chain"
note = "No holding fee."

[demurrage.period]
value = "1 month"
status = "example"
source = "test chain"
note = "Without effect while the rate is off."

[demurrage.free_allowance]
value = "0.00"
status = "example"
source = "test chain"
note = "Without effect while the rate is off."

[accounts.closed_balance]
value = "keep"
status = "example"
source = "test chain"
note = "The balance of a closed account stays."

[sponsoring.keys]
value = []
status = "example"
source = "test chain"
note = "No attributes for sponsors."

[identity.membership_period]
value = "365 days"
status = "example"
source = "test chain"
note = "How long a verification holds."

[identity.person_key_basis]
value = "name-birthdate"
status = "example"
source = "test chain"
note = "What makes a person one person for the identity services: \"name-birthdate\" (name and date of birth from an identity document), \"name-address\" (name and postal address, proven by a letter) or \"document\" (country, kind and number of a document)."

[identity.minimum_age]
value = 0
status = "example"
source = "test chain"
note = "Youngest age in years at which a person is verified. 0: no minimum age."

[identity.key_move_delay]
value = "2 minutes"
status = "example"
source = "test chain"
note = "A lost key: the account moves to a new key after a new verification. The move waits this long, and the old key can stop it. Off: at once."

[identity.face_dedup]
value = false
status = "example"
source = "test chain"
note = "Face dedup at every document check (diary 33). Off, as in alpha."

[verification.price_eur]
value = "1.00"
status = "example"
source = "test chain"
note = "Euro price of one verification."

[door.capita_per_euro]
value = "1.00"
status = "example"
source = "test chain"
note = "Capita one euro buys."

[door.max_payment_eur]
value = "100.00"
status = "example"
source = "test chain"
note = "Most euro one payment may bring in."

[keys.max_keys]
value = 3
status = "example"
source = "test chain"
note = "Most keys one account may have."

[keys.home_delay]
value = "2 minutes"
status = "example"
source = "test chain"
note = "How long a linked device waits before it becomes the home device."

[spam.person_per_day]
value = 100
status = "example"
source = "test chain"
note = "Transactions a verified person may send per day."

[spam.new_key_per_day]
value = 5
status = "example"
source = "test chain"
note = "Transactions a key without a person may send per day."

[spam.new_keys_per_block]
value = 10
status = "example"
source = "test chain"
note = "Transactions of keys without a person one block takes."
# ------------------------------------------------------------------- goods
# Sold digital goods (diary 27, 28; ADR 0019): protection by identity, not
# by locks. Read by the market service and the chain (capita-goods).

[goods.ban_months]
value = 1
status = "example"
source = "test chain"
note = "Length of one ban, in calendar months: the 17th to the 17th. 1st violation: a warning. 2nd: no selling for this long. 3rd and every further one: another such ban that adds no buying, no Capita movements and no chat, video chat or social network. Bans add up; seeing everything, voting, objecting, verifying again and receiving the Capita of one's age always stay."

[goods.reset_after]
value = "2 years"
status = "example"
source = "test chain"
note = "This long without a violation and the ladder starts again at the warning. Sellers see only 'trust ok / reduced' until then."

[goods.compensation_factor]
value = 1
status = "example"
source = "test chain"
note = "The seller of a leaked work receives this many times the price from the leaker, at every violation, the warning included. From the balance only, never below zero; the rest lapses (diary 10: no debt)."

[goods.finder_reward_factor]
value = 1
status = "example"
source = "test chain"
note = "Whoever finds a stolen work receives this many times its price. Who pays it is open (diary 28)."

[goods.max_downloads]
value = 8
status = "example"
source = "test chain"
note = "Downloads one sale gives; each one is the same personal copy."

[goods.answer_time]
value = "14 days"
status = "example"
source = "test chain"
note = "Time an accused member has to answer (stolen device, hacked account) before the decision."

[goods.earnings_hold]
value = "14 days"
status = "example"
source = "test chain"
note = "The earnings of a newly registered work are held this long before they can be spent, so that a compensation is still possible."

[goods.match_threshold]
value = "50 %"
status = "example"
source = "test chain"
note = "An upload whose text print agrees this much with a work another seller registered earlier is held for review (first registration wins). Small edits, a new cover or another format stay far above; different books lie near 0 %."

[goods.gift]
value = false
status = "example"
source = "test chain"
note = "A buyer may give the licence away: the receiver gets a personal copy of their own. Off in alpha, on from step 2 of the market."

[goods.resale]
value = false
status = "example"
source = "test chain"
note = "A buyer may sell the licence on. Off in alpha; later the seller opts in per listing and the price is free."

