sp-block-builder = { git = "https://github.com/duniter/duniter-polkadot-sdk", branch = "duniter-substrate-v1.22.3", default-features = false }
sp-blockchain = { git = "https://github.com/duniter/duniter-polkadot-sdk", branch = "duniter-substrate-v1.22.3", default-features = false }
sp-consensus-aura = { git = "https://github.com/duniter/duniter-polkadot-sdk", branch = "duniter-substrate-v1.22.3", default-features = false }
sp-consensus-grandpa = { git = "https://github.com/duniter/duniter-polkadot-sdk", branch = "duniter-substrate-v1.22.3", default-features = false }
