# Capita Money – workspace
# SPDX-License-Identifier: AGPL-3.0-only
[workspace]
resolver = "2"
members = [
    "crates/capita-core",
    "crates/capita-credential",
    "crates/capita-door",
    "crates/capita-person-key",
    "crates/capita-rulefile",
    "crates/capita-rules",
    "pallets/capita",
    "pallets/credential",
    "pallets/door",
    "runtime",
    "node",
    "services/door",
    "services/issuer",
]
# Plain `cargo test` covers the crates without the Polkadot SDK only; the
# pallets pull in all of it: `cargo test -p pallet-capita`,
# `-p pallet-capita-credential`, `-p capita-runtime`, `-p capita-node`.
default-members = [
    "crates/capita-core",
    "crates/capita-credential",
    "crates/capita-door",
    "crates/capita-person-key",
    "crates/capita-rulefile",
    "crates/capita-rules",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/CapitaMoney/capita-money"
homepage = "https://capitamoney.com"
authors = ["Capita Money contributors"]

# One place for every outside source of the chain side (docs/adr/0010).
[workspace.dependencies]
capita-core = { path = "crates/capita-core", default-features = false }
capita-credential = { path = "crates/capita-credential", default-features = false }
capita-door = { path = "crates/capita-door", default-features = false }
capita-person-key = { path = "crates/capita-person-key", default-features = false }
capita-rulefile = { path = "crates/capita-rulefile" }
capita-rules = { path = "crates/capita-rules", default-features = false }
pallet-capita = { path = "pallets/capita", default-features = false }
pallet-capita-credential = { path = "pallets/credential", default-features = false }
pallet-capita-door = { path = "pallets/door", default-features = false }
capita-runtime = { path = "runtime", default-features = false }

clap = { version = "4.5" }
codec = { package = "parity-scale-codec", version = "3.7.4", default-features = false }
futures = { version = "0.3" }
jsonrpsee = { version = "0.24.3" }
scale-info = { version = "2.11", default-features = false }
serde_json = { version = "1.0", default-features = false }

# Duniter v2: identity and membership. Their crate names equal two unrelated
# pallets of the Polkadot SDK; these are Duniter's.
duniter-primitives = { git = "https://github.com/duniter/duniter-v2s", rev = "71884a456a47eea21bd979c83f3d9e6eee4c7965", default-features = false }
pallet-identity = { git = "https://github.com/duniter/duniter-v2s", rev = "71884a456a47eea21bd979c83f3d9e6eee4c7965", default-features = false }
pallet-membership = { git = "https://github.com/duniter/duniter-v2s", rev = "71884a456a47eea21bd979c83f3d9e6eee4c7965", default-features = false }
sp-membership = { git = "https://github.com/duniter/duniter-v2s", rev = "71884a456a47eea21bd979c83f3d9e6eee4c7965", default-features = false }

# Polkadot SDK, taken from Duniter's fork: Duniter's pallets are built against
# it, and a runtime holds one copy of the SDK. The branch equals the
# crates.io release line of frame-support 46.
frame-executive = { git = "https://github.com/duniter/duniter-polkadot-sdk", branch = "duniter-substrate-v1.22.3", default-features = false }
frame-support = { git = "https://github.com/duniter/duniter-polkadot-sdk", branch = "duniter-substrate-v1.22.3", default-features = false }
frame-system = { git = "https://github.com/duniter/duniter-polkadot-sdk", branch = "duniter-substrate-v1.22.3", default-features = false }
frame-system-rpc-runtime-api = { git = "https://github.com/duniter/duniter-polkadot-sdk", branch = "duniter-substrate-v1.22.3", default-features = false }
frame-try-runtime = { git = "https://github.com/duniter/duniter-polkadot-sdk", branch = "duniter-substrate-v1.22.3", default-features = false }
pallet-aura = { git = "https://github.com/duniter/duniter-polkadot-sdk", branch = "duniter-substrate-v1.22.3", default-features = false }
pallet-grandpa = { git = "https://github.com/duniter/duniter-polkadot-sdk", branch = "duniter-substrate-v1.22.3", default-features = false }
pallet-sudo = { git = "https://github.com/duniter/duniter-polkadot-sdk", branch = "duniter-substrate-v1.22.3", default-features = false }
pallet-timestamp = { git = "https://github.com/duniter/duniter-polkadot-sdk", branch = "duniter-substrate-v1.22.3", default-features = false }
