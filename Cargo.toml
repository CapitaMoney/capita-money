sp-transaction-pool = { git = "https://github.com/duniter/duniter-polkadot-sdk", branch = "duniter-substrate-v1.22.3", default-features = false }
sp-version = { git = "https://github.com/duniter/duniter-polkadot-sdk", branch = "duniter-substrate-v1.22.3", default-features = false }
sc-basic-authorship = { git = "https://github.com/duniter/duniter-polkadot-sdk", branch = "duniter-substrate-v1.22.3", default-features = false }
