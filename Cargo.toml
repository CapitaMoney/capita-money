# The lints below enforce docs/adr/0001 and 0003 by tooling.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
arithmetic_side_effects = "deny"
float_arithmetic = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Dependencies without debug information: the Polkadot SDK builds faster and
# smaller. The crates of this workspace keep theirs.
[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
panic = "unwind"

# Two fixes Duniter maintains for dependencies of the SDK, taken from its
# repository unchanged (docs/adr/0010): multihash without the withdrawn crate
# core2 (RUSTSEC-2026-0105); tracing with tracing-subscriber 0.3.20
# (RUSTSEC-2025-0055).
[patch.crates-io]
multihash = { git = "https://github.com/duniter/duniter-v2s", rev = "71884a456a47eea21bd979c83f3d9e6eee4c7965" }

[patch."https://github.com/duniter/duniter-polkadot-sdk"]
sc-tracing = { git = "https://github.com/duniter/duniter-v2s", rev = "71884a456a47eea21bd979c83f3d9e6eee4c7965" }
sp-tracing = { git = "https://github.com/duniter/duniter-v2s", rev = "71884a456a47eea21bd979c83f3d9e6eee4c7965" }
