# Capita Money – workspace
# SPDX-License-Identifier: AGPL-3.0-only
[workspace]
resolver = "2"
members = ["crates/capita-core", "pallets/capita"]
# Plain `cargo test` covers the core only; the pallet pulls in the whole
# Polkadot SDK: `cargo test -p pallet-capita`.
default-members = ["crates/capita-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/CapitaMoney/capita-money"
homepage = "https://capitamoney.com"
authors = ["Capita Money contributors"]

# The lints below enforce docs/adr/0001 and 0003 by tooling.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
arithmetic_side_effects = "deny"
float_arithmetic = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Dependencies without debug information: the Polkadot SDK builds faster and
# smaller. The crates of this workspace keep theirs.
[profile.dev.package."*"]
debug = false
