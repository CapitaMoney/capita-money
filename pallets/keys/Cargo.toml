# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "pallet-capita-keys"
description = "FRAME pallet: accounts that are acted for by passkeys and device keys – up to three devices, a home key, actions without signer and without fee."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
capita-keys = { workspace = true, features = ["scale"] }
codec = { workspace = true, features = ["derive", "max-encoded-len"] }
scale-info = { workspace = true, features = ["derive"] }
# Polkadot SDK: source and version are set once, in the workspace (docs/adr/0010).
frame-support = { workspace = true }
frame-system = { workspace = true }
sp-core = { workspace = true }
sp-io = { workspace = true }
sp-runtime = { workspace = true }

[dev-dependencies]
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa"] }
serde_json = "1"

[features]
default = ["std"]
std = [
    "capita-keys/std",
    "codec/std",
    "frame-support/std",
    "frame-system/std",
    "scale-info/std",
    "sp-core/std",
    "sp-io/std",
    "sp-runtime/std",
]
try-runtime = [
    "frame-support/try-runtime",
    "frame-system/try-runtime",
    "sp-runtime/try-runtime",
]
