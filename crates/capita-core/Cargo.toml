# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "capita-core"
description = "Pure monetary rules of Capita Money: per-capita issuance, interest-free loans, optional demurrage."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
# Forwards `std` to the optional dependencies. The crate itself never uses
# the standard library.
std = ["codec?/std", "scale-info?/std", "serde?/std"]
# Serialization of all public data types (JSON for the Taler service, etc.).
serde = ["dep:serde"]
# SCALE encoding and type information of all public data types, for storage
# and calls inside a Substrate runtime.
scale = ["dep:codec", "dep:scale-info"]

[dependencies]
codec = { package = "parity-scale-codec", version = "3.7.4", default-features = false, features = ["derive", "max-encoded-len"], optional = true }
scale-info = { version = "2.11", default-features = false, features = ["derive"], optional = true }
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
serde_json = "1.0.154"
