# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "capita-marks"
description = "Personal copies of sold digital goods (EPUB, PDF): a hidden mark that points to the sale, the reader that finds it, and the fingerprints of a work (exact hash, text print). Social DRM: no locks, no encryption."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "capita-marks"
path = "src/main.rs"

[dependencies]
capita-goods = { workspace = true, features = ["std", "serde"] }
clap = { workspace = true, features = ["derive"] }
hmac = "0.12.1"
lopdf = { version = "0.47", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
zip = { version = "9.6", default-features = false, features = ["deflate"] }
