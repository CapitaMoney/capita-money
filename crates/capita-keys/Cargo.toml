# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "capita-keys"
description = "The keys of an account: passkeys (WebAuthn, P-256) and device keys (Ed25519), the bytes they sign, and the check of their signatures. Pure, no_std."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# Forwards `std` to the dependencies. The crate itself never uses the
# standard library.
std = ["codec?/std", "scale-info?/std", "p256/std", "sha2/std", "blake2/std"]
# SCALE encoding and type information, for storage and calls inside a
# Substrate runtime. The bytes a key signs do not depend on it.
scale = ["dep:codec", "dep:scale-info"]

[dependencies]
blake2 = { version = "0.10.6", default-features = false }
codec = { package = "parity-scale-codec", version = "3.7.4", default-features = false, features = ["derive", "max-encoded-len"], optional = true }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa"] }
scale-info = { version = "2.11", default-features = false, features = ["derive"], optional = true }
sha2 = { version = "0.10.9", default-features = false }

[dev-dependencies]
ed25519-dalek = "2.2.0"
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa"] }
serde_json = "1"
